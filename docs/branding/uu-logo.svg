<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Unknown Union">
  <title>Unknown Union — логотип</title>

  <defs>
    <linearGradient id="uu-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161A22"/>
      <stop offset="1" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="uu-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A98CFF"/>
      <stop offset="1" stop-color="#6B4FD8"/>
    </linearGradient>
  </defs>

  <!-- знак -->
  <g transform="translate(40 40) scale(0.625)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#uu-plate)" stroke="#2A2F3A" stroke-width="4"/>
    <g fill="none" stroke="url(#uu-purple)" stroke-width="26" stroke-linecap="round">
      <path d="M124 150 V282 Q124 332 176 332 Q228 332 228 282 V150"/>
      <path d="M284 150 V282 Q284 332 336 332 Q388 332 388 282 V150"/>
    </g>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="112" y1="386" x2="306" y2="386" stroke="#F2F4F8" stroke-opacity="0.9"/>
      <line x1="318" y1="386" x2="400" y2="386" stroke="#8A6CF0"/>
    </g>
  </g>

  <!-- название -->
  <g font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="700">
    <text x="410" y="176" font-size="92" letter-spacing="10" fill="#F2F4F8">UNKNOWN</text>
    <text x="410" y="272" font-size="92" letter-spacing="10" fill="#F2F4F8">UNION</text>
  </g>

  <!-- брендовая линия под названием -->
  <g stroke-linecap="round">
    <line x1="412" y1="308" x2="1460" y2="308" stroke="#20242D" stroke-width="4"/>
    <line x1="412" y1="308" x2="556" y2="308" stroke="#8A6CF0" stroke-width="4"/>
  </g>

  <!-- подпись -->
  <text x="412" y="356" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="26" letter-spacing="9" fill="#8A93A3">SECTOR UU141 · AXIS</text>
</svg>
