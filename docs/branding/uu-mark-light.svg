<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Unknown Union">
  <title>Unknown Union — знак для светлого фона</title>

  <defs>
    <linearGradient id="uu-purple-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B5CE8"/>
      <stop offset="1" stop-color="#503AAE"/>
    </linearGradient>
  </defs>

  <!-- плита -->
