- type: inventoryTemplate
  id: aghost
  slots:
    - name: back
      slotTexture: back
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      displayName: Back
    - name: passport
      slotTexture: passport
      fullTextureName: template_small
      slotFlags: PASSPORT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      displayName: Passport
    - name: position
      slotTexture: position
      fullTextureName: template_small
      slotFlags: POSITION
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,2
      strippingWindowPos: 3,1
      displayName: Position

    # For drip reasons.
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 0,2
      strippingWindowPos: 0,0
      displayName: Head
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 0,1
      strippingWindowPos: 1,1
      displayName: Mask

    # Corvax aghost-MLG start
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,0
      displayName: Eyes
    # Corvax aghost-MLG end
