- type: entity
  parent: BaseStructure
  id: RadioTransmitter
  name: Transmitter
  description: Creates and transmits on radio frequencies. Can only be configured once.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transmitter
  - type: Sprite
    # В тему сервера: это радиооборудование станции, а не абстрактный серверный шкаф.
    sprite: Structures/Machines/telecomms.rsi
    state: telecom-on
  - type: UserInterface
    interfaces:
      enum.FrequencyUiKey.Transmitter:
        type: TransmitterBui
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseItem
  id: RadioDevice
  name: Radio
  description: Receives radio transmissions. Bind it to a transmitter to receive messages.
  components:
  - type: Radio
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    state: walkietalkie
  - type: Clothing
    quickEquip: false
    slots:
    - Belt

- type: entity
  parent: Clothing
  id: RadioEarpiece
  name: Earpiece
  description: A discreet earpiece for receiving radio messages. Bind it to a transmitter.
  components:
  - type: Earpiece
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
  - type: Sprite
    sprite: Clothing/Ears/Headsets/service.rsi
    state: icon

- type: entity
  parent: BaseItem
  id: FrequencyConfigurator
  name: Frequency Configurator
  description: Copies frequencies from transmitters. Use on a transmitter to copy, then on a radio or earpiece to paste.
  components:
  - type: FrequencyConfigurator
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Tools/network_configurator.rsi
    state: icon
  - type: Tag
    tags:
    - Multitool

- type: entity
  parent: BaseStructure
  id: SignalTower
  name: Signal Tower
  description: Extends radio range for a specific frequency by 20 tiles.
  placement:
    mode: SnapgridCenter
  components:
  - type: SignalTower
  - type: Sprite
    # В тему сервера: маяк-ретранслятор вместо маяка сингулярности.
    sprite: Objects/Devices/station_beacon.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseStructure
  id: GeneralJammer
  name: Jammer
  description: Jams all radio transmissions in range.
  placement:
    mode: SnapgridCenter
  components:
  - type: Jammer
    jammerType: General
    radius: 20
  - type: Sprite
    # В тему сервера: настоящий спрайт глушилки, а не поле удержания сингулярности.
    sprite: Objects/Devices/jammer.rsi
    state: jammer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseStructure
  id: SpecificJammer
  name: Frequency Jammer
  description: Jams a specific radio frequency in range.
  placement:
    mode: SnapgridCenter
  components:
  - type: Jammer
    jammerType: Specific
    radius: 20
  - type: ActivatableUI
    key: enum.FrequencyUiKey.Jammer
    inHandsOnly: false
  - type: UserInterface
    interfaces:
      enum.FrequencyUiKey.Jammer:
        type: JammerBui
  - type: Sprite
    # В тему сервера: настоящий спрайт глушилки, а не поле удержания сингулярности.
    sprite: Objects/Devices/jammer.rsi
    state: jammer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
