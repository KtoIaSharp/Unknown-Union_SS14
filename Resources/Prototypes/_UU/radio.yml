- type: entity
  parent: BaseStructure
  id: RadioTransmitter
  name: Transmitter
  description: Creates and transmits on radio frequencies. Can only be configured once.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transmitter
  - type: Sprite
    # Собственный арт UU: 32x32, 4 направленных варианта (Resources/Textures/_UU/transmitter.rsi),
    # ровно тот ретранслятор, который описан в дизайн-документе проекта.
    noRot: false
    sprite: _UU/transmitter.rsi
    layers:
    - state: icon
  - type: UserInterface
    interfaces:
      enum.FrequencyUiKey.Transmitter:
        type: TransmitterBui
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseItem
  id: RadioDevice
  name: Radio
  description: Receives radio transmissions. Bind it to a transmitter to receive messages.
  components:
  - type: Radio
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    state: walkietalkie
  - type: Clothing
    quickEquip: false
    slots:
    - Belt

- type: entity
  parent: Clothing
  id: RadioEarpiece
  name: Earpiece
  description: A discreet earpiece for receiving radio messages. Bind it to a transmitter.
  components:
  - type: Earpiece
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
  - type: Sprite
    sprite: Clothing/Ears/Headsets/service.rsi
    state: icon

- type: entity
  parent: BaseItem
  id: FrequencyConfigurator
  name: Frequency Configurator
  description: Copies frequencies from transmitters. Use on a transmitter to copy, then on a radio or earpiece to paste.
  components:
  - type: FrequencyConfigurator
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Tools/network_configurator.rsi
    state: icon
  - type: Tag
    tags:
    - Multitool

- type: entity
  parent: BaseStructure
  id: SignalTower
  name: Signal Tower
  description: Extends radio range for a specific frequency by 20 tiles.
  placement:
    mode: SnapgridCenter
  components:
  - type: SignalTower
  - type: Sprite
    # Собственный арт UU: решётчатая вышка с маяком, 32x32, 4 направления.
    noRot: false
    sprite: _UU/signal_tower.rsi
    layers:
    - map: [ "tower" ]
      state: idle
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SignalTowerVisuals.State:
        tower:
          Idle: { state: idle }
          Active: { state: active }
          Jammed: { state: jammed }
          Off: { state: off }
  - type: ActivatableUI
    key: enum.FrequencyUiKey.Tower
    inHandsOnly: false
  - type: UserInterface
    interfaces:
      enum.FrequencyUiKey.Tower:
        type: TowerBui
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseStructure
  id: GeneralJammer
  name: Jammer
  description: Jams all radio transmissions in range.
  placement:
    mode: SnapgridCenter
  components:
  - type: Jammer
    jammerType: General
    radius: 20
  - type: Sprite
    # Собственный арт UU: корпус с предупреждающей полосой и излучателями помех.
    noRot: false
    sprite: _UU/jammer.rsi
    layers:
    - state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
- type: entity
  parent: BaseStructure
  id: SpecificJammer
  name: Frequency Jammer
  description: Jams a specific radio frequency in range.
  placement:
    mode: SnapgridCenter
  components:
  - type: Jammer
    jammerType: Specific
    radius: 20
  # Своего окна у глушителя нет: частоту задаёт только конфигуратор частот.
  - type: Sprite
    # Собственный арт UU: та же глушилка, но с частотным дисплеем.
    noRot: false
    sprite: _UU/jammer.rsi
    layers:
    - state: specific
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 50
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: ResistLocker
