- type: entity
  parent: BaseItem
  id: PhotoCamera
  name: фотоаппарат
  description: Простой фотоаппарат для портретов на удостоверения.
  components:
  - type: Sprite
    sprite: Objects/Devices/travel_camera.rsi
    state: icon
  - type: Item
    size: Small
  - type: PhotoCamera

- type: entity
  parent: BaseItem
  id: WorkPhoto
  name: фотография
  description: Портретная фотография. Её можно приложить к удостоверению о работе.
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    state: black
  - type: Item
    size: Tiny
  - type: WorkPhoto
  - type: Tag
    tags:
    - Document

- type: entity
  parent: BaseItem
  id: PositionScanner
  name: сканер должности
  description: Считывает удостоверение и заносит должность, тег и имя в реестр государства.
  components:
  - type: Sprite
    sprite: Objects/Devices/forensic_scanner.rsi
    state: icon
  - type: Item
    size: Small
  - type: PositionScanner

- type: entity
  parent: BaseStructure
  id: WorkRegistryConsole
  name: консоль управления должностями
  description: Реестр должностей и тегов государства. Через неё увольняют с должности.
  placement:
    mode: SnapgridCenter
  components:
  - type: WorkRegistryConsole
  - type: UserInterface
    interfaces:
      enum.WorkRegistryUiKey.Registry:
        type: WorkRegistryBui
      enum.WorkRegistryUiKey.Access:
        type: WorkRegistryBui
  - type: Sprite
    # Собственный спрайт: 32x32, четыре направления, без наложения слоёв.
    sprite: _UU/work_console.rsi
    noRot: false
    layers:
    - state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.35,0.45,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: InteractionOutline
  - type: Anchorable

- type: entity
  parent: RubberStampBase
  id: WorkRegistryStamp
  name: государственная печать реестра
  description: Ставится на подписанное удостоверение о работе. Без печати сканер должности карту не читает.
  components:
  - type: Sprite
    state: stamp-cap
  - type: Item
    size: Tiny
  - type: WorkRegistryStamp

