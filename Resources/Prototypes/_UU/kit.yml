# Коробка с печатной машинкой: игрок получает её в стартовом наборе,
# распаковывает отвёрткой и ставит машинку у себя.
- type: entity
  parent: BaseItem
  id: TypewriterKit
  name: typewriter kit
  description: A typewriter packed in a box. Unpack it with a screwdriver.
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box
  - type: Item
    size: Normal
  - type: Flatpack
    qualityNeeded: Screwing
    entity: Typewriter
