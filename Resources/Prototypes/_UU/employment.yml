- type: entity
  parent: BaseItem
  id: WorkIdCard
  name: удостоверение о работе
  description: Пластиковая карта с данными о работе. Заполняется только через ручной работодатель.
  components:
  - type: Sprite
    sprite: _UU/work_id.rsi
    state: icon
  - type: Item
    size: Small
  - type: WorkIdCard
  - type: UserInterface
    interfaces:
      enum.WorkIdCardUiKey.Card:
        type: WorkIdCardBui

- type: entity
  parent: WorkIdCard
  id: WorkIdCardBlank
  name: пустое удостоверение о работе
  description: Пластиковая заготовка удостоверения. Заполняется в консоли работодателя.

- type: entity
  parent: BaseItem
  id: WorkIdWriter
  name: ручной работодатель
  description: Ручной сканер, который переносит данные с подписанного договора на удостоверение о работе.
  components:
  - type: Sprite
    sprite: _UU/work_writer.rsi
    state: icon
  - type: Item
    size: Small
  - type: WorkIdWriter

- type: entity
  parent: Paper
  id: EmploymentContract
  name: договор о трудоустройстве
  description: Бланк договора о трудоустройстве. Подписывается отдельно работодателем и работником.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
  - type: EmploymentContract
  - type: UserInterface
    interfaces:
      # Окно обычной бумаги здесь намеренно не регистрируется: через него можно
      # переписать текст уже оформленного договора. Договор открывается только
      # собственным окном, где содержимое править нельзя.
      enum.EmploymentContractUiKey.Contract:
        type: EmploymentContractBui
