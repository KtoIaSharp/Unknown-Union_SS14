# Графы крафта офисного оборудования UU (меню крафта, не фабы).

- type: constructionGraph
  id: UUTypewriter
  start: start
  graph:
    - node: start
      edges:
        - to: typewriter
          steps:
            - material: Steel
              amount: 2
              doAfter: 4
            - material: Plastic
              amount: 1
              doAfter: 2
    - node: typewriter
      entity: Typewriter

